name: Build and deploy Aseprite

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      force_build:
        description: Build even if the latest release has not changed
        type: boolean
        required: false
        default: true

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  check-version:
    name: Check latest Aseprite release
    runs-on: ubuntu-latest
    outputs:
      latest_tag: ${{ steps.version.outputs.latest_tag }}
      download_url: ${{ steps.version.outputs.download_url }}
      should_build: ${{ steps.decision.outputs.should_build }}

    steps:
      - name: Get latest release information
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          data=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/aseprite/aseprite/releases/latest)

          tag=$(jq -er '.tag_name' <<< "$data")
          url=$(jq -er \
            '[.assets[].browser_download_url | select(endswith(".zip"))][0]' \
            <<< "$data")

          echo "latest_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "download_url=$url" >> "$GITHUB_OUTPUT"

      - name: Restore last checked version
        id: version-cache
        uses: actions/cache/restore@v4
        with:
          path: .aseprite-version
          key: aseprite-version-${{ steps.version.outputs.latest_tag }}

      - name: Decide whether to build
        id: decision
        env:
          EVENT: ${{ github.event_name }}
          FORCE_BUILD: ${{ inputs.force_build }}
          CACHE_HIT: ${{ steps.version-cache.outputs.cache-hit }}
        run: |
          if [[ "$EVENT" == "workflow_dispatch" && "$FORCE_BUILD" == "true" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [[ "$CACHE_HIT" != "true" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build-aseprite:
    name: Build Aseprite (Linux)
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build 7zip unzip curl \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libfontconfig1-dev libfreetype6-dev

      - name: Restore Skia cache
        id: skia-cache
        uses: actions/cache@v4
        with:
          path: skia
          key: skia-linux-x64-m124-08a5439a6b

      - name: Download Skia
        if: steps.skia-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fL \
            https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Linux-Release-x64.zip \
            -o skia.zip
          mkdir -p skia
          unzip -q skia.zip -d skia

      - name: Download Aseprite source
        env:
          DOWNLOAD_URL: ${{ needs.check-version.outputs.download_url }}
        run: |
          set -euo pipefail
          curl -fL "$DOWNLOAD_URL" -o aseprite-source.zip
          mkdir aseprite
          unzip -q aseprite-source.zip -d aseprite
          mkdir -p aseprite/build

      - name: Configure CMake
        working-directory: aseprite/build
        run: |
          cmake \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$GITHUB_WORKSPACE/skia" \
            -DSKIA_LIBRARY_DIR="$GITHUB_WORKSPACE/skia/out/Release-x64" \
            -G Ninja ..

      - name: Build Aseprite
        working-directory: aseprite/build
        run: ninja aseprite

      - name: Package
        working-directory: aseprite/build/bin
        env:
          TAG: ${{ needs.check-version.outputs.latest_tag }}
        run: |
          set -euo pipefail
          7zz a "$GITHUB_WORKSPACE/Aseprite-${TAG}-Linux.zip" \
            aseprite data

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-${{ needs.check-version.outputs.latest_tag }}-Linux
          path: Aseprite-${{ needs.check-version.outputs.latest_tag }}-Linux.zip
          if-no-files-found: error
          retention-days: 30

      # Mark version as built only after a successful build,
      # so a failed build retries on the next run.
      - name: Record built version
        run: echo "${{ needs.check-version.outputs.latest_tag }}" > .aseprite-version

      - name: Save built version
        uses: actions/cache/save@v4
        with:
          path: .aseprite-version
          key: aseprite-version-${{ needs.check-version.outputs.latest_tag }}
